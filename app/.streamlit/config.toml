[theme]
base = "light"
primaryColor = "#cd5f37"
backgroundColor = "#faf7f4"
secondaryBackgroundColor = "#f4e9e3"
textColor = "#30221d"
linkColor = "#a84724"
borderColor = "#eaded8"
baseRadius = "0.35rem"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
showWidgetBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false
