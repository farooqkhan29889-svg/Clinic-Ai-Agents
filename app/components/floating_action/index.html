<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{width:100%;height:100%;margin:0;background:transparent;overflow:visible}
    body{font-family:Arial,sans-serif}
    #action{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;height:54px;padding:0 15px;border:1px solid #ffffffa8;border-radius:999px;background:linear-gradient(135deg,#c85d38,#a84724);box-shadow:0 9px 24px #481e0b35;color:#fff;font-size:14px;font-weight:700;white-space:nowrap;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
    #action.assistant{background:linear-gradient(135deg,#176b50,#0c543e)}
    #action:active{cursor:grabbing;transform:scale(.98)}
    #symbol{display:grid;place-items:center;width:24px;height:24px;border:1px solid #ffffff75;border-radius:50%;font-size:15px;line-height:1}
    #grip{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;line-height:10px;letter-spacing:-2px;opacity:.68}
    #action{position:relative;padding-right:25px}
    @media(prefers-reduced-motion:no-preference){#action{transition:box-shadow .18s,filter .18s}#action:hover{filter:brightness(1.06);box-shadow:0 12px 27px #481e0b45}}
  </style>
</head>
<body>
  <button id="action" type="button" title="Drag to move; position is saved in this browser">
    <span id="symbol" aria-hidden="true"></span><span id="label"></span><span id="grip" aria-hidden="true">⋮⋮</span>
  </button>
  <script src="./index.js"></script>
</body>
</html>
