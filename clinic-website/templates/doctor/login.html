{% extends "base.html" %}
{% block title %}Doctor login - CityCare Clinic{% endblock %}
{% block content %}
  <section class="page-hero">
    <div class="container">
      <h1 style="font-size:clamp(24px,3vw,32px);">Doctor panel</h1>
      <p>Tap your name to see your appointments.</p>
    </div>
  </section>
  <section class="section" style="padding-top:36px;">
    <div class="container" style="max-width:720px;">
      <div class="pick-grid">
        {% for d in doctors %}
        <form method="POST" action="/doctor" style="margin:0;">
          <input type="hidden" name="doctor_id" value="{{ d.id }}">
          <button class="pick-card" type="submit" style="width:100%;padding:16px;">
            <div class="doc-avatar" style="background:{{ d.color }}">{{ d.initials }}</div>
            <div><b style="font-size:15px;">{{ d.name }}</b><span>{{ d.spec }}</span></div>
          </button>
        </form>
        {% endfor %}
      </div>
      <p style="font-size:12px;color:var(--ink-3);text-align:center;margin-top:18px;">No password needed in this demo version. Each doctor sees only their own patients.</p>
    </div>
  </section>
{% endblock %}
